info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/auth/token
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "secret123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.body.token;
        bru.setVar("jwtToken", token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
