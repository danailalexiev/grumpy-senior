spring.application.name=grumpy-senior

# Auth props
jwt.public.key=classpath:certs/public.pem
jwt.private.key=classpath:certs/private-pkcs8.pem

# Database props
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/schema.sql,classpath:db/data.sql

# AI props
spring.ai.google.genai.api-key=${GEMINI_AI_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite

# Logging props
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=debug